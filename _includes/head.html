<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>{{ page.title | default: site.title }}</title>
<meta
  name="description"
  content="{{ page.description | default: site.description }}"
/>
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#102a20" />

<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml" />
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}" />

<meta property="og:type" content="website" />
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta property="og:description" content="{{ page.description | default: site.description }}" />
<meta property="og:url" content="{{ site.url }}{{ site.baseurl }}" />
<meta property="og:image" content="{{ site.url }}{{ '/assets/images/social-card.png' | relative_url }}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="W3C TPAC hackathon 2026. Dublin, Monday 26 October, 19:00–22:30 GMT. Clayton Hotel Burlington Road." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image:alt" content="W3C TPAC hackathon 2026. Dublin, Monday 26 October, 19:00–22:30 GMT. Clayton Hotel Burlington Road." />

<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}" />

<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Event",
    "name": "W3C TPAC hackathon 2026",
    "description": {{ site.description | jsonify }},
    "startDate": "{{ site.data.event.datetime_iso }}",
    "endDate": "{{ site.data.event.end_datetime_iso }}",
    "eventStatus": "https://schema.org/EventScheduled",
    "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
    "location": {
      "@type": "Place",
      "name": {{ site.data.event.venue | jsonify }},
      "description": {{ site.data.event.room | jsonify }},
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Dublin",
        "addressCountry": "IE"
      }
    },
    "organizer": {
      "@type": "Organization",
      "name": "W3C",
      "url": "https://www.w3.org"
    },
    "isAccessibleForFree": true,
    "url": "{{ site.url }}{{ site.baseurl }}"
  }
</script>
